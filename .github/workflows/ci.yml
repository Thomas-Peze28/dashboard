name: CI

on:
  push:
    branches: ["main", "dev", "CI/CD"]
  pull_request:
    branches: ["main", "dev", "CI/CD"]

jobs:
  code-quality:
    name: Lint & Typecheck
    runs-on: self-hosted

    strategy:
      matrix:
        service: [backend, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies (${{ matrix.service }})
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Validate Prisma Schema (backend only)
        if: matrix.service == 'backend'
        working-directory: ${{ matrix.service }}
        run: npx prisma validate
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/testdb"

      - name: Generate Prisma Client (backend only)
        if: matrix.service == 'backend'
        working-directory: ${{ matrix.service }}
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/testdb"

      - name: Lint (${{ matrix.service }})
        working-directory: ${{ matrix.service }}
        run: npm run lint --if-present

      - name: Typecheck TypeScript (${{ matrix.service }})
        working-directory: ${{ matrix.service }}
        run: npx tsc --noEmit

      - name: Build (${{ matrix.service }})
        working-directory: ${{ matrix.service }}
        run: npm run build --if-present

  backend-tests:
    name: Backend Integration Tests
    runs-on: self-hosted
    needs: code-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Start PostgreSQL test container
        run: |
          docker rm -f postgres-test-ci || true
          docker run -d \
            --name postgres-test-ci \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=dashboard_test \
            -p 5433:5432 \
            postgres:16-alpine

      - name: Start Mailpit test container
        run: |
          docker rm -f mailpit-test-ci || true
          docker run -d \
            --name mailpit-test-ci \
            -p 1026:1025 \
            axllent/mailpit:latest

      - name: Wait for PostgreSQL to be ready
        run: |
          until docker exec postgres-test-ci pg_isready -U postgres; do
            sleep 1
          done

      - name: Wait for Mailpit to be ready
        run: |
          until (echo > /dev/tcp/localhost/1026) 2>/dev/null; do
            sleep 1
          done

      - name: Deploy Prisma migrations to test DB
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5433/dashboard_test?schema=public"
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Run Vitest
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5433/dashboard_test?schema=public"
          JWT_SECRET: "ci_integration_test_secret"
          SMTP_HOST: "localhost"
          SMTP_PORT: "1026"
        run: npm test

      - name: Stop PostgreSQL test container
        if: always()
        run: docker rm -f postgres-test-ci || true

      - name: Stop Mailpit test container
        if: always()
        run: docker rm -f mailpit-test-ci || true

  docker-build:
    name: Build Docker Images
    runs-on: self-hosted
    needs: [code-quality, backend-tests]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: docker build -t dashboard-backend ./backend

      - name: Build Frontend Image
        run: docker build -t dashboard-frontend ./frontend
