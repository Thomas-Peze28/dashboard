name: CI

on:
  push:
    branches: [ "main" , "dev", "CI/CD" ]
  pull_request:
    branches: [ "main" , "dev" , "CI/CD" ]

jobs:
  code-quality:
    name: Lint & Typecheck
    runs-on: self-hosted

    strategy:
      matrix:
        service: [backend, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies (${{ matrix.service }})
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Validate Prisma Schema (backend only)
        if: matrix.service == 'backend'
        working-directory: ${{ matrix.service }}
        run: npx prisma validate

      - name: Generate Prisma Client (backend only)
        if: matrix.service == 'backend'
        working-directory: ${{ matrix.service }}
        run: npx prisma generate

      - name: Lint (${{ matrix.service }})
        working-directory: ${{ matrix.service }}
        run: npm run lint --if-present

      - name: Typecheck TypeScript (${{ matrix.service }})
        working-directory: ${{ matrix.service }}
        run: npx tsc --noEmit

      - name: Build (${{ matrix.service }})
        working-directory: ${{ matrix.service }}
        run: npm run build --if-present

  docker-build:
    name: Build Docker Images
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: docker build -t dashboard-backend ./backend

      - name: Build Frontend Image
        run: docker build -t dashboard-frontend ./frontend