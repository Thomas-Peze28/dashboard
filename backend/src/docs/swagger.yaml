openapi: 3.0.3
info:
  title: Dashboard API
  description: REST API for the Dashboard project.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: System
    description: Service discovery and health endpoints
  - name: Authentication
    description: Local account authentication and email verification
  - name: OAuth
    description: OAuth authentication redirects and callbacks
  - name: Users
    description: Authenticated user operations
  - name: Services
    description: Available services and widget definitions
  - name: Widgets
    description: Authenticated dashboard widget operations
  - name: Widget - Clock
    description: |
      Data returned by `GET /api/widgets/{id}/data` for the widgets of the **time** service.
      The `#widget_name` suffix only identifies the widget in this documentation: it is not sent to the server.
  - name: Widget - Weather
    description: |
      Data returned by `GET /api/widgets/{id}/data` for the widgets of the **weather** service (Open-Meteo).
      The `#widget_name` suffix only identifies the widget in this documentation: it is not sent to the server.
  - name: Widget - GitHub
    description: |
      Data returned by `GET /api/widgets/{id}/data` for the widgets of the **github** service.
      These widgets call the GitHub API with the token of the user's linked GitHub account (sign in with GitHub first).
      The `#widget_name` suffix only identifies the widget in this documentation: it is not sent to the server.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    User:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
          nullable: true
        role:
          type: string
          enum: [USER, ADMIN]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        isVerified:
          type: boolean

    AuthenticatedUser:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
          nullable: true
        role:
          type: string
          enum: [USER, ADMIN]

    WidgetParameter:
      type: object
      required: [name, type, description]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [string, integer, boolean, float]
        description:
          type: string

    ServiceWidget:
      type: object
      required: [id, name, description, params]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        params:
          type: array
          items:
            $ref: '#/components/schemas/WidgetParameter'

    Service:
      type: object
      required: [id, name, widgets]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        widgets:
          type: array
          items:
            $ref: '#/components/schemas/ServiceWidget'

    WidgetDefinition:
      type: object
      required: [id, serviceId, name]
      properties:
        id:
          type: string
          format: uuid
        serviceId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        params:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/WidgetParameter'

    UserWidget:
      type: object
      required: [id, userId, widgetId, config, refreshInterval, positionX, positionY, width, height]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        widgetId:
          type: string
          format: uuid
        config:
          type: object
          additionalProperties: true
        refreshInterval:
          type: integer
          minimum: 5
          default: 30
          description: Refresh timer of the widget, in seconds
        positionX:
          type: integer
          default: 0
        positionY:
          type: integer
          default: 0
        width:
          type: integer
          default: 2
        height:
          type: integer
          default: 2
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        widget:
          $ref: '#/components/schemas/WidgetDefinition'

    WidgetPosition:
      type: object
      properties:
        positionX:
          type: integer
        positionY:
          type: integer
        width:
          type: integer
        height:
          type: integer

    ClockData:
      type: object
      required: [timezone, time, date]
      properties:
        timezone:
          type: string
          description: IANA timezone used for the computation (UTC if not configured)
          example: Europe/Paris
        time:
          type: string
          description: Current time, HH:mm:ss (24h)
          example: '11:42:07'
        date:
          type: string
          description: Current date, long French format
          example: jeudi 8 octobre 2026

    WeatherCurrentData:
      type: object
      required: [city, country, time, temperature, apparentTemperature, humidity, windSpeed, weatherCode, description, isDay, units]
      properties:
        city:
          type: string
          example: Lille
        country:
          type: string
          nullable: true
          example: France
        time:
          type: string
          description: Local time of the measurement (Open-Meteo updates it every 15 minutes)
          example: '2026-10-08T11:30'
        temperature:
          type: number
          example: 12.9
        apparentTemperature:
          type: number
          example: 10.5
        humidity:
          type: number
          example: 83
        windSpeed:
          type: number
          example: 16.2
        weatherCode:
          type: integer
          description: WMO weather interpretation code
          example: 51
        description:
          type: string
          description: Readable label of the WMO code
          example: Light drizzle
        isDay:
          type: boolean
          example: true
        units:
          type: object
          required: [temperature, humidity, windSpeed]
          properties:
            temperature:
              type: string
              example: °C
            humidity:
              type: string
              example: '%'
            windSpeed:
              type: string
              example: km/h

    WeatherForecastDay:
      type: object
      required: [date, weatherCode, description, temperatureMax, temperatureMin, precipitation]
      properties:
        date:
          type: string
          format: date
          example: '2026-10-09'
        weatherCode:
          type: integer
          nullable: true
          description: WMO weather interpretation code
          example: 61
        description:
          type: string
          example: Slight rain
        temperatureMax:
          type: number
          nullable: true
          example: 13.4
        temperatureMin:
          type: number
          nullable: true
          example: 8.7
        precipitation:
          type: number
          nullable: true
          example: 6.4

    WeatherForecastData:
      type: object
      required: [city, country, days, units]
      properties:
        city:
          type: string
          example: Tokyo
        country:
          type: string
          nullable: true
          example: Japan
        days:
          type: array
          description: One entry per day, from 1 to 7 days depending on the `days` parameter (default 5)
          items:
            $ref: '#/components/schemas/WeatherForecastDay'
        units:
          type: object
          required: [temperature, precipitation]
          properties:
            temperature:
              type: string
              example: °C
            precipitation:
              type: string
              example: mm

    GithubRepoData:
      type: object
      required: [repository, description, url, owner, language, stars, forks, openIssues, watchers, isPrivate, defaultBranch, pushedAt]
      properties:
        repository:
          type: string
          example: facebook/react
        description:
          type: string
          nullable: true
          example: The library for web and native user interfaces.
        url:
          type: string
          format: uri
          example: https://github.com/facebook/react
        owner:
          type: object
          required: [login, avatarUrl]
          properties:
            login:
              type: string
              example: facebook
            avatarUrl:
              type: string
              format: uri
              example: https://avatars.githubusercontent.com/u/69631?v=4
        language:
          type: string
          nullable: true
          example: JavaScript
        stars:
          type: integer
          example: 232000
        forks:
          type: integer
          example: 47500
        openIssues:
          type: integer
          description: Open issues and pull requests (GitHub counts both)
          example: 1020
        watchers:
          type: integer
          example: 6600
        isPrivate:
          type: boolean
          example: false
        defaultBranch:
          type: string
          example: main
        pushedAt:
          type: string
          format: date-time
          example: '2026-10-08T09:12:44Z'

  parameters:
    UserWidgetId:
      name: id
      in: path
      required: true
      description: ID of the widget on the user's dashboard (UserWidget)
      schema:
        type: string
        format: uuid

paths:
  /about.json:
    get:
      summary: Get API information and the service catalog
      tags: [System]
      responses:
        '200':
          description: Client information and available services
          content:
            application/json:
              schema:
                type: object
                required: [client, server]
                properties:
                  client:
                    type: object
                    required: [host]
                    properties:
                      host:
                        type: string
                  server:
                    type: object
                    required: [current_time, services]
                    properties:
                      current_time:
                        type: integer
                        description: Current Unix timestamp in seconds
                      services:
                        type: array
                        items:
                          type: object
                          required: [name, widgets]
                          properties:
                            name:
                              type: string
                            widgets:
                              type: array
                              items:
                                $ref: '#/components/schemas/ServiceWidget'

  /api/health:
    get:
      summary: Check API health
      tags: [System]
      responses:
        '200':
          description: API is operational
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /api/auth/register:
    post:
      summary: Register a user
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                name:
                  type: string
      responses:
        '201':
          description: Account created and verification email sent
          content:
            application/json:
              schema:
                type: object
                required: [message, user]
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/AuthenticatedUser'
        '400':
          description: Missing fields or password shorter than eight characters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email address is already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error

  /api/auth/confirm/{token}:
    get:
      summary: Confirm a user's email address
      tags: [Authentication]
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirects to the frontend login page with a success flag
          headers:
            Location:
              schema:
                type: string
        '400':
          description: Invalid verification token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error

  /api/auth/login:
    post:
      summary: Log in with email and password
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Authentication succeeded
          content:
            application/json:
              schema:
                type: object
                required: [message, token, user]
                properties:
                  message:
                    type: string
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/AuthenticatedUser'
        '400':
          description: Email or password is missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Email address has not been verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error

  /api/auth/google:
    get:
      summary: Redirect to Google OAuth authorization
      tags: [OAuth]
      responses:
        '302':
          description: Redirects to Google's authorization page

  /api/auth/google/callback:
    get:
      summary: Handle the Google OAuth callback
      tags: [OAuth]
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
          description: Authorization code returned by Google
      responses:
        '302':
          description: Redirects to the frontend with a JWT or an OAuth error

  /api/auth/github:
    get:
      summary: Redirect to GitHub OAuth authorization
      tags: [OAuth]
      responses:
        '302':
          description: Redirects to GitHub's authorization page

  /api/auth/github/callback:
    get:
      summary: Handle the GitHub OAuth callback
      tags: [OAuth]
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
          description: Authorization code returned by GitHub
      responses:
        '302':
          description: Redirects to the frontend with a JWT or an OAuth error

  /api/users/me:
    get:
      summary: Get the authenticated user's profile
      tags: [Users]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Authenticated user profile
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Authentication is required or the token is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
        '500':
          description: Internal server error

  /api/services:
    get:
      summary: List available services and widget definitions
      tags: [Services]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Available service catalog
          content:
            application/json:
              schema:
                type: object
                required: [services]
                properties:
                  services:
                    type: array
                    items:
                      $ref: '#/components/schemas/Service'
        '401':
          description: Authentication is required or the token is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error

  /api/widgets:
    get:
      summary: List the authenticated user's dashboard widgets
      tags: [Widgets]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User dashboard widgets
          content:
            application/json:
              schema:
                type: object
                required: [widgets]
                properties:
                  widgets:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserWidget'
        '401':
          description: Authentication is required or the token is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
    post:
      summary: Add a widget to the authenticated user's dashboard
      tags: [Widgets]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [widgetId, config]
              properties:
                widgetId:
                  type: string
                  format: uuid
                config:
                  type: object
                  additionalProperties: true
                refreshInterval:
                  type: integer
                  minimum: 5
                  default: 30
                  description: Refresh timer of the widget, in seconds
                positionX:
                  type: integer
                  default: 0
                positionY:
                  type: integer
                  default: 0
                width:
                  type: integer
                  default: 2
                height:
                  type: integer
                  default: 2
      responses:
        '201':
          description: Widget added
          content:
            application/json:
              schema:
                type: object
                required: [widget]
                properties:
                  widget:
                    $ref: '#/components/schemas/UserWidget'
        '400':
          description: widgetId or config is missing or invalid, or refreshInterval is not an integer >= 5
        '401':
          description: Authentication is required or the token is invalid
        '404':
          description: Widget definition not found
        '500':
          description: Internal server error

  /api/widgets/{id}:
    patch:
      summary: Update a dashboard widget
      tags: [Widgets]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WidgetPosition'
                - type: object
                  properties:
                    config:
                      type: object
                      additionalProperties: true
                    refreshInterval:
                      type: integer
                      minimum: 5
                      description: Refresh timer of the widget, in seconds
      responses:
        '200':
          description: Widget updated
          content:
            application/json:
              schema:
                type: object
                required: [widget]
                properties:
                  widget:
                    $ref: '#/components/schemas/UserWidget'
        '400':
          description: Widget ID is missing, or refreshInterval is not an integer >= 5
        '401':
          description: Authentication is required or the token is invalid
        '404':
          description: Widget not found for the authenticated user
        '500':
          description: Internal server error
    delete:
      summary: Remove a widget from the dashboard
      tags: [Widgets]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Widget removed
        '400':
          description: Widget ID is missing
        '401':
          description: Authentication is required or the token is invalid
        '404':
          description: Widget not found for the authenticated user
        '500':
          description: Internal server error

  /api/widgets/{id}/data:
    get:
      summary: Fetch fresh data for a dashboard widget
      tags: [Widgets]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Data calculated by the widget service
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    description: Depends on the widget type, see the "Widget - Clock", "Widget - Weather" and "Widget - GitHub" sections
                    oneOf:
                      - $ref: '#/components/schemas/ClockData'
                      - $ref: '#/components/schemas/WeatherCurrentData'
                      - $ref: '#/components/schemas/WeatherForecastData'
                      - $ref: '#/components/schemas/GithubRepoData'
        '400':
          description: Widget ID is missing, or the widget configuration is invalid (ex. city or repository not found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication is required or the token is invalid
        '403':
          description: The widget needs a linked third-party account (ex. GitHub) that is missing, expired or revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Widget not found for the authenticated user
        '501':
          description: Widget data handler is not implemented
        '502':
          description: The external API used by the widget (ex. Open-Meteo) is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error

  '/api/widgets/{id}/data#digital_clock':
    get:
      summary: Digital clock data
      description: |
        Configuration (`config` of the UserWidget): `{ "timezone": "Europe/Paris" }` (IANA timezone, UTC by default)
      operationId: getWidgetData_digital_clock
      tags: ['Widget - Clock']
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserWidgetId'
      responses:
        '200':
          description: Widget data
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ClockData'
        '401':
          description: Authentication is required or the token is invalid
        '404':
          description: Widget not found for the authenticated user

  '/api/widgets/{id}/data#analog_clock':
    get:
      summary: Analog clock data
      description: |
        Configuration (`config` of the UserWidget): `{ "timezone": "Europe/Paris" }` (IANA timezone, UTC by default)
      operationId: getWidgetData_analog_clock
      tags: ['Widget - Clock']
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserWidgetId'
      responses:
        '200':
          description: Widget data
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ClockData'
        '401':
          description: Authentication is required or the token is invalid
        '404':
          description: Widget not found for the authenticated user

  '/api/widgets/{id}/data#weather_current':
    get:
      summary: Current weather of a city
      description: |
        Configuration (`config` of the UserWidget): `{ "city": "Lille" }` (Paris by default)
      operationId: getWidgetData_weather_current
      tags: ['Widget - Weather']
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserWidgetId'
      responses:
        '200':
          description: Widget data
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/WeatherCurrentData'
        '400':
          description: City not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: City not found.
        '502':
          description: Open-Meteo is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: External service unavailable.
        '401':
          description: Authentication is required or the token is invalid
        '404':
          description: Widget not found for the authenticated user

  '/api/widgets/{id}/data#weather_forecast':
    get:
      summary: Daily weather forecast of a city
      description: |
        Configuration (`config` of the UserWidget): `{ "city": "Tokyo", "days": 3 }` (Paris and 5 days by default, `days` clamped between 1 and 7)
      operationId: getWidgetData_weather_forecast
      tags: ['Widget - Weather']
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserWidgetId'
      responses:
        '200':
          description: Widget data
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/WeatherForecastData'
        '400':
          description: City not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: City not found.
        '502':
          description: Open-Meteo is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: External service unavailable.
        '401':
          description: Authentication is required or the token is invalid
        '404':
          description: Widget not found for the authenticated user

  '/api/widgets/{id}/data#github_repo':
    get:
      summary: Statistics of a GitHub repository
      description: |
        Configuration (`config` of the UserWidget): `{ "repository": "facebook/react" }` (required, `owner/repo` format).
        Requires a GitHub account linked to the user.
      operationId: getWidgetData_github_repo
      tags: ['Widget - GitHub']
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserWidgetId'
      responses:
        '200':
          description: Widget data
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/GithubRepoData'
        '400':
          description: Invalid `repository` format, or repository not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidConfig:
                  value:
                    error: Invalid widget configuration.
                notFound:
                  value:
                    error: GitHub resource not found.
        '401':
          description: Authentication is required or the token is invalid
        '403':
          description: No GitHub account linked, or the GitHub token is expired or revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notLinked:
                  value:
                    error: No GitHub account linked. Please sign in with GitHub.
                tokenInvalid:
                  value:
                    error: GitHub token expired or revoked. Please sign in with GitHub again.
        '404':
          description: Widget not found for the authenticated user
        '502':
          description: GitHub is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: External service unavailable.
