  '/api/widgets/{id}/data#pokemon_card':
    get:
      summary: A Pokémon card chosen by the user
      description: |
        Configuration (`config` of the UserWidget): `{ "name": "Charizard", "language": "en" }` (`fr`, `en`, `de`, `es`, `it`, `pt` or `ja`, French by default).
        The name must be written in the card language (ex: Dracaufeu in French, Charizard in English).
        TCGdex matches partial names: a card with the exact name is preferred, otherwise the first matching card that has an image is displayed.
        To keep one exact card, send its TCGdex ID instead: `{ "id": "base1-4", "language": "fr" }`. The name is then ignored.
        In both cases the response contains the card details, read from the full TCGdex card (they are null if this second call fails).
      operationId: getWidgetData_pokemon_card
      tags: ['Widget - Pokémon']
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserWidgetId'
      responses:
        '200':
          description: Widget data
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PokemonRandomCardData'
        '400':
          description: name is missing or no card matches it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Pokémon card not found.
        '502':
          description: TCGdex is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: External service unavailable.
        '401':
          description: Authentication is required or the token is invalid
        '404':
          description: Widget not found for the authenticated user
